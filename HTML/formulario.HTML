<!--Indica que el tipo de archivo es html-->
<!DOCTYPE html>
<!--La etiqueta "html" engloba todo el codigo html, 
el atributo "lang" idioma de la pagina "en" ingles, "es" español-->
<html lang="español--">
  <!--head, info no vivible por el usuario pero es importante 
  y los buscadores la detectan-->
<head>
  <!--Conjunto de caracteres manejados en la pagina web-->
  <meta charset="UTF-8">
  <!--Indica que es una pagina web responsive (no tiene porque ser responsive)-->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!--Indica el titulo de la pagina, visualizable en google-->
  <title>Document</title>
</head>
<!--Todo lo visible en la pagina web-->
<body>
  <!--Formulario-->
  <form action="">
    <!--Etiqueta-->
    <label for="Nombre">Nombre:</label>
    <input type="text" id="Nombre" name="Nombre">
      <input type="text" id="nombre" name="nombre" required placeholder="Escribe tu nombre">
      <br>
      <label for="fecha_de_nacimiento">Fecha de nacimiento:</label>
      <input type="date" id="fecha_de_nacimiento" name="fecha_de_nacimiento">
      <br>
      <label for="genero">Genero:</label>
      <select name="genero" id="genero">
        <option value="masculino">Masculino</option>
        <option value="femenino">Femenino</option>
        <option value="otro">Otro</option>
      </select>
      <br>
      <label for="numero_telefono">Número de teléfono:</label>
      <input type="tel" id="numero_telefono" name="numero_telefono">
      <br>
      <label for="email">Email:</label>
      <input type="email" id="email" name="email">
      <br>
      <label for="password">Contraseña:</label>
      <input type="password" id="password" name="password">
      <br>
      <label for="incapacidad">¿Tiene alguna discapacidad?</label>
      <input type="radio" name="incapacidad" id="incapacidad_si" value="verdadero">
      <label for="incapacidad_si">Sí</label>
      <input type="radio" name="incapacidad" id="incapacidad_no" value="falso">
      <label for="incapacidad_no">No</label>
      <br>
      <label for="descripcion">Breve descripción de tu persona</label>
      <textarea name="descripcion" id="descripcion"></textarea>
      <br>
      <input type="submit" value="Enviar">
    </form>
  </body>
</html>

<!--
  Proyecto de HTML
  Realiza una pagina que funcione como tu CV, el cual debe de contener:
  - Tu nombre completo
  - Tu fecha de nacimiento
  - Tu genero
  - Tu numero de telefono
  - Tu email

  - Experiencia laboral
  - Habilidades
  - Estudios realizados

  Debes utilizar etiquetas semanticas, como por ejemplo:
  - header
  - section
  
  etc.

  Debes de agregar un formulario de contacto al final, debe de tener
  - Un campo para el nombre
  - Un campo para el email
  - Un campo para el numero de telefono
  - Un campo para el mensaje

  Puedes agregar botones, imagenes, videos, etc. para hacer tu CV mas atractivo visualmente

  Fecha de entrega: 16/02/26
-->
  </form>
</body>
</html>
